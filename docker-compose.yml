services:
  vegetarian-juice-shop:
    build: .
    container_name: vegetarian-juice-shop
    hostname: vegetarian-juice-shop
    ports:
      - "2212:2212"
    environment:
      - NODE_ENV=development
      - PORT=2212
    volumes:
      - ./uploads:/app/uploads
      - juice-db:/app
    restart: unless-stopped
    networks:
      pentest-lab:
        ipv4_address: 10.10.20.125

  # Uncomment to run Kali as a container on the same network:
  #
  # kali:
  #   image: kalilinux/kali-rolling
  #   container_name: kali
  #   hostname: kali
  #   stdin_open: true
  #   tty: true
  #   networks:
  #     pentest-lab:
  #       ipv4_address: 10.10.20.50
  #   # Target is reachable at: http://10.10.20.125:2212

volumes:
  juice-db:

networks:
  pentest-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
          gateway: 10.10.20.1
